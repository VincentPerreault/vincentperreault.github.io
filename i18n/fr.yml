# French UI strings for the theme.
# The theme ships these as i18n/fr-FR.yml, but this site's language key is
# `fr` (see hugo.toml), which Hugo only matches against i18n/fr.yml — so the
# theme file is never picked up and FR pages fell back to English. This
# project-level copy (which overrides the theme module) fixes that.

layout:
  post: Post
  category: Catégorie
  tag: Tag

# The tabs of sidebar
tabs:
  home: Accueil
  categories: Catégories
  tags: Tags
  archives: Archives
  about: À propos

# the text displayed in the search bar & search results
search:
  hint: recherche
  cancel: Annuler
  no_results: Oups ! Aucun résultat trouvé.

panel:
  # deliberately "ajouté" rather than the theme's "mis à jour": the panel
  # lists the latest posts, not modified ones
  lastmod: Récemment ajouté
  trending_tags: Tags tendance
  toc: Contenu

copyright:
  # Shown at the bottom of the post
  license:
    template: Cet article est sous licence :LICENSE_NAME par l'auteur.
    name: CC BY 4.0
    link: https://creativecommons.org/licenses/by/4.0/deed.fr

  # Displayed in the footer
  brief: Certains droits réservés.
  verbose: >-
    Sauf mention contraire, les articles de ce site sont publiés
    sous la licence Creative Commons Attribution 4.0 International (CC BY 4.0) par l'auteur.

meta: Propulsé par :PLATFORM avec le thème :THEME

not_found:
  statement: Désolé, nous avons égaré cette URL ou elle pointe vers quelque chose qui n'existe pas.

notification:
  update_found: Une nouvelle version du contenu est disponible.
  update: Mise à jour

# ----- Posts related labels -----

post:
  written_by: Par
  posted: Posté
  updated: Mis à jour
  # Rendered as one sentence by layouts/post/single.html:
  # "Publié le <date>, mis à jour le <date_updated>".
  # Deliberately NOT reusing `posted`/`updated` above: for any key the theme
  # module already defines, the module's own i18n wins over the project's, so
  # overriding those two has no effect. Names the theme does not define do work.
  posted_on: Publié le
  updated_on: mis à jour le
  words: mots
  pageview_measure: vues
  read_time:
    unit: min
    # Leading space is intentional: the theme's read-time partial only auto-inserts
    # a space before single-word prompts, so multi-word ones must carry their own.
    prompt: ' de lecture'
  relate_posts: Autres lectures
  share: Partager
  button:
    next: Plus récent
    previous: Plus ancien
    copy_code:
      succeed: Copié !
    share_link:
      title: Copier le lien
      succeed: Lien copié avec succès !

# categories page
# (the theme's fr-FR.yml has these as flat strings, but the templates look
# up singular/plural sub-keys, so they'd fall back to English)
categories:
  category_measure:
    singular: catégorie
    plural: catégories
  post_measure:
    singular: post
    plural: posts
