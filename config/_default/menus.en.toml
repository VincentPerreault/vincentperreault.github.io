# Sidebar main menu (English). Defined in config rather than page front
# matter: front-matter menu entries can vanish from `hugo server`'s
# incremental rebuilds (config menus are stable, and production builds
# were never affected). `pageRef` resolves within the language, `pre` is
# the Font Awesome icon used by the sidebar partial.

[[main]]
  name = 'Home'
  pageRef = '/'
  weight = 1
  pre = 'fa-house'

