# The base URL for the site. Left over from the starter template, it pointed
# at geekifan's own demo — and since `config/_default/` outranks the root
# `hugo.toml`, that stale value won: `hugo server` served the site under
# http://localhost:1313/chirpy-starter/ instead of the root. Production was
# unaffected only because the deploy workflow passes --baseURL explicitly.
baseURL = 'https://vincentperreault.github.io/'
# The title of the site. (Overridden per language in languages.toml.)
title = "Vincent's Blog"
# Enable Git info › https://gohugo.io/methods/page/gitinfo/
enableGitInfo = false
# The default content language.
defaultContentLanguage = "en"
# Whether the default content language is in a subdirectory.
defaultContentLanguageInSubdir = false
# Whether the site has CJK language (Chinese, Japanese, Korean).
hasCJKLanguage = true

# Pagination settings.
[pagination]
  pagerSize = 5

# Make sure to include JSON output to support the search functionality.
[outputs]
  home = ["HTML", "RSS", "JSON"]

# Import the theme.
[module]
  [[module.imports]]
    path = "github.com/geekifan/hugo-theme-chirpy"