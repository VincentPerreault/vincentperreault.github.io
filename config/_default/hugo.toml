# The base URL for the site. Left over from the starter template, it pointed
# at geekifan's own demo — and since `config/_default/` outranks the root
# `hugo.toml`, that stale value won: `hugo server` served the site under
# http://localhost:1313/chirpy-starter/ instead of the root. Production was
# unaffected only because the deploy workflow passes --baseURL explicitly.
baseURL = 'https://vincentperreault.github.io/'
# The title of the site. (Overridden per language in languages.toml.)
title = "Vincent's Blog"
# Enable Git info › https://gohugo.io/methods/page/gitinfo/
# This is what makes a post's "updated on" date automatic: Hugo reads the
# date of the last commit that touched the post's own markdown file. It is
# how upstream Chirpy does it too (_plugins/posts-lastmod-hook.rb runs
# `git log -1` per post). Needs full history, which the deploy workflow
# already checks out (fetch-depth: 0).
enableGitInfo = true

# Where `.Lastmod` comes from, in order. Git normally wins, so the date is
# automatic and always reflects the real last edit — the same contract as
# upstream Chirpy, whose hook overwrites the value outright. An explicit
# `lastmod:` in a post's front matter is the one escape hatch, for pinning a
# date by hand; `date` is the fallback when a file has no commit yet (a new
# post you have not committed), and renders no "updated" line at all.
#
# The older `date_updated:` key is no longer read — the post still carrying
# one can have that line dropped next time it is edited.
[frontmatter]
  lastmod = ['lastmod', ':git', 'date']
# The default content language.
defaultContentLanguage = "en"
# Whether the default content language is in a subdirectory.
defaultContentLanguageInSubdir = false
# Whether the site has CJK language (Chinese, Japanese, Korean).
hasCJKLanguage = true

# Pagination settings.
[pagination]
  pagerSize = 5

# Make sure to include JSON output to support the search functionality.
[outputs]
  home = ["HTML", "RSS", "JSON"]

# Import the theme.
[module]
  [[module.imports]]
    path = "github.com/geekifan/hugo-theme-chirpy"

# Dev server only (ignored by `hugo` builds and by production).
#
# Hugo serves /js/*.js unfingerprinted and sends no Cache-Control or ETag,
# only Last-Modified, so browsers fall back to heuristic caching and keep
# running a stale bundle after an edit. The CSS is fingerprinted and updates
# fine, which is the worst case: new CSS against old JS, so components render
# half-rebuilt instead of visibly breaking. Force revalidation instead.
[[server.headers]]
  for = "/**.js"
  [server.headers.values]
    Cache-Control = "no-store"
