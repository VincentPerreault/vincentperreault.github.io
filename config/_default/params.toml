# boolean type, the global switch for TOC in posts.
toc = true
# the avatar on sidebar, should be a relative path to /assets.
avatar = "img/commons/avatar.png"
author = "yifan"

# "Edit this post" link shown at the bottom of every post
# (upstream Chirpy 7.6.0 feature, see layouts/partials/post-edit.html).
[actions]
  [actions.edit_post]
    enabled = true
    # Repository base URL for the editor. With `static_url = false` the post's
    # source path (relative to content/) is appended to it.
    url = "https://github.com/VincentPerreault/vincentperreault.github.io/edit/main/content"
    static_url = false

[assets]
  # Self-hosted static assets, default to false. If true, the assets will be hosted on your own server.
  self_host = false

[social]
  name = "Vincent Perreault"
  url = "https://github.com/VincentPerreault"

[[social.links]]
  type = "github"
  id = "VincentPerreault"
  icon = "fab fa-github"

[[social.links]]
  type = "email"
  id = "your[.]email[at]example[.]com"
  icon = "fas fa-envelope"

[[social.links]]
  type = "linkedin"
  id = "vperreault"
  icon = "fab fa-linkedin-in"

[[social.links]]
  type = "rss"
  icon = "fas fa-rss"
  noblank = true  # will not open in new window

[comments]
# Global switch for the post-comment system. [true | false]
enable = false
# The provider options are as follows: [disqus | utterances | giscus]
provider = ""

# Disqus options
[comments.disqus]
# fill with the Disqus shortname. › https://help.disqus.com/en/articles/1717111-what-s-a-shortname
shortname = ""

# utterances settings › https://utteranc.es/
[comments.utterances]
# <gh-username>/<repo>
repo = ""
# < url | pathname | title | ...>
issue_term = ""

# Giscus options › https://giscus.app
[comments.giscus]
# <gh-username>/<repo>
repo = ""
repo_id = ""
category = ""
category_id = ""
# optional, default to 'pathname'
mapping = ""
# optional, default to '0'
strict = ""
# optional, default to 'bottom'
input_position = ""
# optional, default to site language
lang = ""
# optional, default to the value of `1`
reactions_enabled = ""