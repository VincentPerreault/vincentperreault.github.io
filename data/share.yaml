# Sharing options at the bottom of a post (rendered by
# layouts/partials/post-sharing.html). Icons from <https://fontawesome.com/>.
# TITLE and URL are replaced with the post's escaped title and permalink.

platforms:
  - type: LinkedIn
    icon: "fab fa-linkedin"
    link: "https://www.linkedin.com/feed/?shareActive=true&shareUrl=URL"

  - type: Twitter
    icon: "fa-brands fa-square-x-twitter"
    link: "https://twitter.com/intent/tweet?text=TITLE&url=URL"

  - type: Reddit
    icon: "fa-brands fa-square-reddit"
    link: "https://www.reddit.com/submit?url=URL&title=TITLE"

  - type: Bluesky
    icon: "fa-brands fa-bluesky"
    link: "https://bsky.app/intent/compose?text=TITLE%20URL"

  # Uncomment (or add) any other platform you want to offer.
  #
  # - type: Facebook
  #   icon: "fab fa-facebook-square"
  #   link: "https://www.facebook.com/sharer/sharer.php?title=TITLE&u=URL"
  #
  # - type: Telegram
  #   icon: "fab fa-telegram"
  #   link: "https://t.me/share/url?url=URL&text=TITLE"
  #
  # - type: Mastodon
