name: Update theme

# Controls when the workflow will run
on:
  schedule:
    # Update theme automatically everyday at 00:00 UTC
    - cron: "0 0 * * *"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  update-theme:
    runs-on: ubuntu-latest

    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository.
      contents: write
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Update theme
        run: hugo mod get -u github.com/geekifan/hugo-theme-chirpy

      - name: Tidy go.mod, go.sum
        run: hugo mod tidy

      # `hugo mod tidy` prunes a go.sum line that every normal Hugo run writes
      # back. Left alone, the file flips between two states forever: this job
      # removes the line, the next local build re-adds it, and each push ends
      # with a "CI: Update theme" commit that only deletes it again. Loading
      # the modules once after the tidy leaves go.sum exactly the way a local
      # build does, so the job only commits when the theme really changed.
      - name: Let Hugo restore the go.sum lines it needs
        run: hugo mod graph

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "CI: Update theme"